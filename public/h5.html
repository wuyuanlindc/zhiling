  <style>
    /* 底部标签：图标第一行、文案第二行，整体居中 */
    .bottom-nav .nav-item{display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0;height:100%;padding:0;line-height:1}
    .bottom-nav .nav-icon{position:relative;display:grid;place-items:center;width:25px;height:25px;flex:0 0 25px}
    .bottom-nav .nav-item i{display:block;width:23px;height:23px;margin:0}
    .bottom-nav .nav-label{display:block;line-height:17px;white-space:nowrap}
    .bottom-nav .badge{position:absolute;right:-11px;top:-7px;margin:0;z-index:1}
    .task-title{flex-wrap:nowrap;min-width:0;padding-right:88px}
    .task-title .title-text{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .task-title .chip{flex:0 0 auto}
    /* 流转记录固定为：日期列 / 时间列 / 事件内容列，避免互相遮挡 */
    .detail-block .timeline{margin-left:130px;padding-left:36px}
    .detail-block .event{min-height:54px}
    .detail-block .event:before{left:-42px}
    .detail-block .event time{position:static;display:block;height:0}
    .detail-block .event-date,.detail-block .event-clock{position:absolute;top:0;color:#555;white-space:nowrap;font-style:normal;font-weight:400}
    .detail-block .event-date{left:-184px}
    .detail-block .event-clock{left:-88px}
    /* 详情附件与流转记录：按生产端 H5 的纵向卡片结构展示 */
    .detail-block .files{display:block;flex:1;min-width:0;overflow:visible}
    .detail-block .file{width:100%;min-width:0;height:58px;margin:0 0 8px;padding:9px 11px;border:1px solid #edf0f3;border-radius:4px;background:#f7f8fa;gap:10px}
    .detail-block .file:last-child{margin-bottom:0}
    .detail-block .file>span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .detail-block .file:after{content:'⇩';margin-left:auto;color:#4778cf;font-size:18px;line-height:1}
    .detail-block .flow-list{margin:0;padding:0;border:0}
    .detail-block .flow-item{position:relative;margin:0;padding:0 0 15px 17px;min-height:0}
    .detail-block .flow-item:last-child{padding-bottom:0}
    .detail-block .flow-item:before{content:'';position:absolute;left:0;top:7px;width:9px;height:9px;border-radius:50%;background:#9a5b2e}
    .detail-block .flow-item.primary:before{background:#12beb7}
    .detail-block .flow-head{min-height:22px;display:flex;align-items:center;gap:10px;line-height:22px}
    .detail-block .flow-head strong{font-size:16px;white-space:nowrap}
    .detail-block .flow-time{color:#959595;font-size:13px;font-weight:400;white-space:nowrap}
    .detail-block .flow-view{margin-left:auto;border:0;background:transparent;padding:0;color:var(--brown);font-size:14px;line-height:22px}
    .detail-block .flow-message{margin-top:7px;padding:9px 11px;border-radius:7px;background:#f7f7f7;color:#777;font-size:13px;line-height:20px}
    /* H5 指令详情头部：按生产截图的 ID 顶栏、标题区与展开区展示 */
    .detail{padding:0 12px 90px}
    .detail .backline{display:none}
.h5-detail-nav{height:48px;margin:0 -12px -1px;padding:0 18px;background:#fff1df;display:flex;align-items:center}
.h5-state-label{display:inline-flex;align-items:center;justify-content:center;min-width:68px;height:28px;padding:0 12px;border-radius:15px;background:#7d441f;color:#fff;font-size:14px;font-weight:600;line-height:1}
.h5-state-label.approval{background:#427ed9}.h5-state-label.archived{background:#12a99e}
    .h5-detail-nav button{display:inline-flex;align-items:center;gap:5px;border:0;background:transparent;padding:0;color:#1d1d1d;font-size:19px;font-weight:700;line-height:1}
    .h5-detail-nav button i{width:22px;height:22px;stroke-width:2.1}
    .detail-head{margin:0;border-radius:13px;overflow:hidden;background:#fff;box-shadow:none}
    .detail-head .detail-state{display:none}
    .h5-idbar{height:29px;display:flex;align-items:center;gap:7px;padding:0 12px;border-radius:13px 13px 0 0;background:#555d79;color:#d8d9e3;font-size:11px;letter-spacing:.1px}
    .h5-idbar i{width:13px;height:13px;color:#f7d087}
    .h5-title-area{position:relative;padding:13px 12px 10px;border-bottom:1px dashed #e7e7e7}
.h5-title-line{display:block;padding-right:0;font-size:0}
.h5-title-line .chip{display:inline;margin:0 7px 0 0;background:#714025;color:#fff;padding:2px 5px;font-size:13px;font-weight:500;line-height:19px;vertical-align:2px}
.h5-title-text{font-size:18px;line-height:28px;font-weight:700;color:#262120;word-break:break-all}
    .h5-detail-status{position:absolute;right:12px;top:13px;padding:4px 8px;border-radius:18px;color:#fff;background:#ff4d54;font-size:13px;line-height:18px;white-space:nowrap}
    .h5-detail-status.pending{background:#7d441f}.h5-detail-status.approval{background:#427ed9}.h5-detail-status.archived{background:#12a99e}
    .h5-deadline{margin-top:6px;color:#999;font-size:13px;line-height:18px}
    .h5-overdue{position:absolute;right:12px;bottom:11px;font-size:13px;color:#f04652;font-weight:600}
    .h5-basic-info{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;padding:11px 12px;color:#777;font-size:13px;line-height:20px;border-bottom:1px dashed #e7e7e7}
    .h5-basic-info span{display:block;color:#aaa;font-size:12px}
    .detail-head .expand{width:100%;height:43px;padding:0;border:0;background:#fff;display:flex;align-items:center;justify-content:center;gap:5px;font-size:14px;color:#795033}
    .detail-head .expand i{width:15px;height:15px}
    /* H5 详情底部按钮左右铺满 */
    .detail-footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(var(--h5-width),100vw);padding:12px 14px;background:#fff;display:flex;justify-content:space-between;gap:12px;z-index:22;border-top:1px solid #eee}
    .detail-footer .small-btn{flex:1;height:44px;border-radius:8px;font-size:16px;font-weight:500;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
    .detail-footer .small-btn.outline{background:#fff;border:1px solid #723c1e;color:#723c1e}
    .detail-footer .small-btn:not(.outline){background:#723c1e;color:#fff;border:0}

    /* H5 指令下发 - 基础信息与表单样式 (参照截图1/2/3) */
    .h5-issue-container{padding:14px 14px 90px;background:#f8f9fa;min-height:100vh}
    .h5-origin-box{background:#fdf9f2;border:1px solid #f2e7da;border-radius:12px;padding:15px 14px;margin-bottom:14px}
    .h5-origin-top{display:flex;align-items:center;gap:7px;font-size:16px;font-weight:700;color:#3d2012}
    .h5-origin-top i{width:18px;height:18px;color:#703516;stroke-width:2.2}
    .h5-origin-tip{font-size:13px;color:#857467;margin:8px 0 12px;line-height:1.4}
    .h5-origin-input-row{display:flex;flex-direction:column;gap:10px;align-items:stretch}
    .h5-origin-input{width:100%;height:42px;background:#fff;border:1px solid #dfd5cb;border-radius:8px;padding:0 12px;font-size:14px;color:#333;outline:none;box-sizing:border-box}
    .h5-origin-input::placeholder{color:#b6aba2}
    .h5-origin-btn{width:100%;height:42px;background:#b0917c;border:0;border-radius:8px;color:#fff;font-size:15px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .h5-origin-btn:active{background:#9a7b66}
    .h5-form-section{background:#fff;border-radius:12px;padding:16px 14px;margin-bottom:14px}
    .h5-form-header{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;color:#3d2012;margin-bottom:12px}
    .h5-form-header i{width:19px;height:19px;color:#703516}
    .h5-field-block{margin-bottom:14px}
    .h5-field-label{font-size:14px;font-weight:500;color:#222;margin-bottom:7px;display:flex;align-items:center}
    .h5-field-label.req:after{content:"*";color:#f04444;margin-left:4px}
    .h5-input-box{width:100%;height:44px;border:1px solid #e5e5e5;border-radius:8px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;background:#fff;font-size:14px;color:#333}
    .h5-input-box input{width:100%;border:0;outline:none;background:transparent;font-size:14px;color:#333;font-family:inherit}
    .h5-input-box input::placeholder{color:#bbb}
    .h5-input-box.disabled{background:#f6f6f6;color:#888;border-color:#ededed}
    .h5-input-box i{width:18px;height:18px;color:#999;flex-shrink:0}
    .h5-counter{font-size:12px;color:#aaa;text-align:right;margin-top:4px}
    .h5-textarea{width:100%;height:88px;border:1px solid #e5e5e5;border-radius:8px;padding:10px 12px;font-size:14px;color:#333;outline:none;resize:none;font-family:inherit;background:#fff}
    .h5-textarea::placeholder{color:#bbb}

    /* H5 ID 复制按钮 */
    .h5-copy-id-btn{
      display:inline-flex;
      align-items:center;
      gap:2px;
      background:#f1f5f9;
      border:1px solid #cbd5e1;
      border-radius:4px;
      padding:2px 6px;
      font-size:11px;
      color:#475569;
      cursor:pointer;
      line-height:1;
      vertical-align:middle;
    }
    .h5-copy-id-btn:active{
      background:#e2e8f0;
      transform:scale(0.95);
    }
    .h5-copy-id-btn i, .h5-copy-id-btn svg{
      width:11px;
      height:11px;
    }

    /* 原文内容获取 - 列表页 (参照截图2) */
    .h5-origin-page{padding:10px 0 85px;background:#f6f6f6;min-height:100vh}
    .h5-origin-tpl-tip{padding:4px 14px 10px;font-size:13px;color:#666}
    .h5-origin-card{background:#fff;border-radius:12px;margin:0 12px 10px;padding:14px 15px;box-shadow:0 1px 3px rgba(0,0,0,.02)}
    .h5-card-prop-title{font-size:15px;font-weight:700;color:#222;margin-bottom:6px}

function showToast(msg){
  const el=document.getElementById('h5Toast');
  if(!el)return;
  el.textContent=msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2000);
}

function copyH5Text(text, label = '指令ID'){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{
      showToast(`已复制${label}：${text}`);
    }).catch(()=>{
      showToast(`已复制${label}：${text}`);
    });
  } else {
    var ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    showToast(`已复制${label}：${text}`);
  }
}

function openFillDrawer(fieldKey, fieldName){
  document.getElementById('overlay').classList.add('show');
  
  // 选项配置
  let options = [
    { key: '', label: '未填入' },
    { key: 'title', label: '指令标题' },
    { key: 'source', label: '舆情来源' },
    { key: 'desc', label: '舆情说明' },
    { key: 'note', label: '备注' }
  ];

  if(fieldKey === 'source'){
    options = [
      { key: '', label: '未填入' },
      { key: 'source', label: '舆情来源' },
      { key: 'note', label: '备注' }
    ];
  } else if(fieldKey === 'time'){
    options = [
      { key: '', label: '未填入' },
      { key: 'deadline', label: '限时时间' },
      { key: 'note', label: '备注' }
    ];
  }

  const currentTarget = issueForm.originMappings[fieldKey] || '';

  const optionsHtml = options.map(opt => {
    const isSelected = currentTarget === opt.key;
    return `
      <div class="h5-fill-option ${isSelected?'selected':''}" onclick="selectFillTarget('${fieldKey}', '${opt.key}')">
        <span>${opt.label}</span>
        <span class="h5-fill-radio">
          ${isSelected ? icon('check') : ''}
        </span>
      </div>

  }).join('');

  document.getElementById('actionSheet').innerHTML = `
    <div class="h5-fill-drawer">

        <span>${fieldName} · 填充到</span>
        <i data-lucide="x" onclick="closeSheets()"></i>
      </div>
      <div class="h5-fill-options-list">
        ${optionsHtml}
      </div>
    </div>
  `;
  openSheet();
}

function selectFillTarget(fieldKey, targetKey){
  issueForm.originMappings[fieldKey] = targetKey;
  closeSheets();
  renderOriginFetchPage();
}

// 确认填入操作
function confirmFillFields(){
  let filledCount = 0;
  // 遍历所有映射进行回填
  for(const [fieldKey, targetKey] of Object.entries(issueForm.originMappings)){
    if(!targetKey) continue;
    const val = originData[fieldKey];
    if(val && val !== '-'){
      if(targetKey === 'title'){
        issueForm.title = val;
        filledCount++;
      } else if(targetKey === 'source'){
        issueForm.source = val;
        filledCount++;
      } else if(targetKey === 'desc'){
        issueForm.desc = (issueForm.desc ? issueForm.desc + '\n' : '') + val;
        filledCount++;
      } else if(targetKey === 'note'){
        issueForm.note = (issueForm.note ? issueForm.note + '；' : '') + `${targetLabels[fieldKey]||fieldKey}：${val}`;
        filledCount++;
      } else if(targetKey === 'deadline'){
        issueForm.deadline = val;
        filledCount++;
      }
    }
  }

  if(filledCount > 0){
    showToast(`已成功填入 ${filledCount} 项字段内容`);
  } else {
    showToast('未选择有效字段内容');
  }

  setTimeout(()=>{
    openIssue();
  }, 400);
}
